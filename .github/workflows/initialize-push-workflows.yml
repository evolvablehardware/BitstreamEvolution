name: Test and Build Website for Pushed Code
run-name: Testing ${{ github.actor }}'s commit

on:
  push:
    branches: ["main","develop"]

env:
  MAIN_BRANCH: 'main' # Have this specified in some other file.
  SECONDARY_BRANCH: 'develop' # Have this specified in some other file.
  TEMP_WEBSITE_FOLDER: '.website'
  SECONDARY_SITE_DIRECTORY: 'dev'

permissions:
  contents: write

jobs:

  # NOTE: This reusable workflow is pinned to @main because GitHub Actions
  # requires a static ref for `uses:`. If read-toml.yml is changed on
  # develop, it must be merged to main before those changes take effect here.
  PyprojectTOML:
    uses: evolvablehardware/BitstreamEvolution/.github/workflows/read-toml.yml@main
    with:
      branch: ${{github.ref_name}} #select committed branch
      values: "[\"python_versions\",\"homepage\",\"repository\",
        \"pytest_testing_groups\",\"test_results_display_selector\",
        \"test_results_display_summary\"]"

  RunTests:
    needs: PyprojectTOML

    strategy:
      fail-fast: false #this means that all matrix tests don't stop as soon as first on fails
      matrix:
        python-version: ${{fromJson(needs.PyprojectTOML.outputs.toml_values)['python_versions']}}
        pytest-testing-group: ${{fromJson(needs.PyprojectTOML.outputs.toml_values)['pytest_testing_groups']}}
        run-on: ['ubuntu-latest']

    runs-on: ${{matrix.run-on}}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v5
      with:
        python-version: ${{matrix.python-version}}
    - name: Install pipx
      if: false
      run: |
        sudo apt update
        sudo apt install pipx
        pipx ensurepath
        sudo pipx ensurepath

    - name: Install poetry
      run: |
        pip install poetry

    - name: Install Testing Dependencies
      run: |
        poetry install --with gh_tests

    - name: Sanitize test group name
      id: sanitize
      run: |
        SANITIZED=$(echo "${{ matrix.pytest-testing-group }}" | tr ' ' '-')
        echo "group_slug=${SANITIZED}" >> $GITHUB_OUTPUT

    - name: Run Tests in Python ${{matrix.python-version}} with masks ${{matrix.pytest-testing-group}}
      run: |
        poetry run pytest -m "${{matrix.pytest-testing-group}}" --junitxml=junit/test-results-${{ matrix.python-version }}-${{ steps.sanitize.outputs.group_slug }}.xml

    - name: Upload pytest test results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{strategy.job-index}}of${{strategy.job-total}}-python${{ matrix.python-version }}
        path: junit/test-results-${{ matrix.python-version }}-${{ steps.sanitize.outputs.group_slug }}.xml
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

    - name: View Test results
      uses: pmeier/pytest-results-action@main
      if: ${{ always() }}
      with:
        # A list of JUnit XML files, directories containing the former, and wildcard
        # patterns to process.
        path: junit/test-results-${{ matrix.python-version }}-${{ steps.sanitize.outputs.group_slug }}.xml

        # (Optional) Add a summary of the results at the top of the report
        summary: ${{fromJson(needs.PyprojectTOML.outputs.toml_values)['test_results_display_summary']}}

        # (Optional) Select which results should be included in the report.
        #   f - failed        X - xpassed
        #   E - error         p - passed
        #   s - skipped       P - passed with output
        #   x - xfailed
        display-options: ${{fromJson(needs.PyprojectTOML.outputs.toml_values)['test_results_display_selector']}}

        # (Optional) Fail the workflow if no JUnit XML was found.
        fail-on-empty: true

        # (Optional) Title of the test results section in the workflow summary
        title: Results For python${{matrix.python-version}} markers "${{matrix.pytest-testing-group}}"


  build-website:
    needs: RunTests
    if: ${{always()}}

    runs-on: ubuntu-latest
    steps:

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Directory Structure
        run: |
          mkdir $MAIN_BRANCH
          mkdir $SECONDARY_BRANCH
          mkdir $TEMP_WEBSITE_FOLDER

      - name: Install Graphviz
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install General dependencies
        run: |
          pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-docs-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-docs-

      - name: Determine test status
        id: test-status
        run: |
          if [ "${{ needs.RunTests.result }}" = "failure" ]; then
            echo "sphinx_tags=-t tests_failed" >> $GITHUB_OUTPUT
          else
            echo "sphinx_tags=" >> $GITHUB_OUTPUT
          fi

      - name: Download JUnit test results
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-results-*
          path: ${{ github.workspace }}/junit-results
          merge-multiple: true
        continue-on-error: true

      - name: Stage JUnit XML results
        run: |
          # Each (python-version, test-group) matrix job produces a uniquely-named
          # XML file (e.g. test-results-3.11-immediate-or-short.xml).  The Sphinx
          # directive groups them by version automatically.
          mkdir -p ${{ github.workspace }}/merged-junit
          cp ${{ github.workspace }}/junit-results/test-results-*.xml \
             ${{ github.workspace }}/merged-junit/ 2>/dev/null \
             || echo "No JUnit XML files found."
        continue-on-error: true

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: ${{env.MAIN_BRANCH}}
          path: ${{github.workspace}}/${{env.MAIN_BRANCH}}

      - name: 'MAIN SITE: Install dependencies with Sphinx'
        run: |
          cd ${{github.workspace}}/${{env.MAIN_BRANCH}}
          poetry install --with gh_docs --no-root

      - name: 'MAIN SITE: Sphinx build (Release Mode)'
        run: |
          cd ${{github.workspace}}/${{env.MAIN_BRANCH}}
          poetry run sphinx-build docs/sphinx/source docs/sphinx/build -t release ${{ steps.test-status.outputs.sphinx_tags }}
          cp -r docs/sphinx/build/* ${{github.workspace}}/${{env.TEMP_WEBSITE_FOLDER}}

      - name: Checkout Secondary Branch
        uses: actions/checkout@v4
        with:
          ref: ${{env.SECONDARY_BRANCH}}
          path: ${{github.workspace}}/${{env.SECONDARY_BRANCH}}

      - name: 'SECONDARY SITE: Install dependencies with Sphinx'
        run: |
          ls -a ${{github.workspace}}
          cd ${{github.workspace}}/${{env.SECONDARY_BRANCH}}
          pwd
          poetry install --with gh_docs --no-root

      - name: 'SECONDARY SITE: Copy JUnit XML results to static directory'
        run: |
          mkdir -p ${{github.workspace}}/${{env.SECONDARY_BRANCH}}/docs/sphinx/source/_static/test-results
          cp ${{ github.workspace }}/merged-junit/*.xml ${{github.workspace}}/${{env.SECONDARY_BRANCH}}/docs/sphinx/source/_static/test-results/ || true
        continue-on-error: true

      - name: 'SECONDARY SITE: Sphinx build (Dev Mode)'
        run: |
          cd ${{github.workspace}}/${{env.SECONDARY_BRANCH}}
          poetry run sphinx-build docs/sphinx/source ${{github.workspace}}/${{env.TEMP_WEBSITE_FOLDER}}/${{env.SECONDARY_SITE_DIRECTORY}} -t dev ${{ steps.test-status.outputs.sphinx_tags }}

      - name: Add .nojekyll
        run: touch ${{ env.TEMP_WEBSITE_FOLDER }}/.nojekyll

      - name: Deploy Combined Website to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.TEMP_WEBSITE_FOLDER }}
